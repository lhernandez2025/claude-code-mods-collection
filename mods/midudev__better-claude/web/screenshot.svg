<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>A pricing page with three plans: Free, Pro and Team</title>
  <rect width="480" height="300" rx="9" fill="#f6f6f4"/>
  <path d="M0 9a9 9 0 0 1 9-9h462a9 9 0 0 1 9 9v21H0z" fill="#e6e6e3"/>
  <circle cx="17" cy="15" r="5.5" fill="#ff5f57"/>
  <circle cx="35" cy="15" r="5.5" fill="#febc2e"/>
  <circle cx="53" cy="15" r="5.5" fill="#28c840"/>
  <rect x="150" y="7" width="180" height="16" rx="5" fill="#f6f6f4"/>
  <text x="240" y="19" text-anchor="middle" fill="#7a7a7a" font-size="10">localhost:3000/pricing</text>
  <rect y="30" width="480" height="1" fill="#d9d9d6"/>

  <text x="240" y="62" text-anchor="middle" fill="#141414" font-size="18" font-weight="700">Simple pricing</text>
  <text x="240" y="80" text-anchor="middle" fill="#76766f" font-size="10.5">Pick a plan. Change or cancel anytime.</text>

  <g font-size="10.5" fill="#3d3d3a">
    <rect x="24" y="96" width="136" height="184" rx="8" fill="#fff" stroke="#e3e3df"/>
    <text x="38" y="119" fill="#5c5c57" font-size="11.5" font-weight="600">Free</text>
    <text x="38" y="149" fill="#141414" font-size="24" font-weight="700">$0<tspan fill="#8a8a84" font-size="10.5" font-weight="400"> /month</tspan></text>
    <text x="38" y="175"><tspan fill="#3a9a5b">✓</tspan>  1 project</text>
    <text x="38" y="193"><tspan fill="#3a9a5b">✓</tspan>  1 GB of storage</text>
    <text x="38" y="211"><tspan fill="#3a9a5b">✓</tspan>  Community help</text>
    <rect x="38" y="236" width="108" height="28" rx="6" fill="#fff" stroke="#d6d6d1"/>
    <text x="92" y="254" text-anchor="middle" fill="#141414" font-weight="600">Get started</text>

    <rect x="172" y="96" width="136" height="184" rx="8" fill="#fff" stroke="#d77757" stroke-width="1.5"/>
    <text x="186" y="119" fill="#5c5c57" font-size="11.5" font-weight="600">Pro</text>
    <rect x="252" y="107" width="44" height="16" rx="8" fill="#fbe8e1"/>
    <text x="274" y="118.5" text-anchor="middle" fill="#c2603e" font-size="8.5" font-weight="600">Popular</text>
    <text x="186" y="149" fill="#141414" font-size="24" font-weight="700">$12<tspan fill="#8a8a84" font-size="10.5" font-weight="400"> /month</tspan></text>
    <text x="186" y="175"><tspan fill="#3a9a5b">✓</tspan>  Unlimited projects</text>
    <text x="186" y="193"><tspan fill="#3a9a5b">✓</tspan>  50 GB of storage</text>
    <text x="186" y="211"><tspan fill="#3a9a5b">✓</tspan>  Email support</text>
    <rect x="186" y="236" width="108" height="28" rx="6" fill="#d77757"/>
    <text x="240" y="254" text-anchor="middle" fill="#fff" font-weight="600">Start free trial</text>

    <rect x="320" y="96" width="136" height="184" rx="8" fill="#fff" stroke="#e3e3df"/>
    <text x="334" y="119" fill="#5c5c57" font-size="11.5" font-weight="600">Team</text>
    <text x="334" y="149" fill="#141414" font-size="24" font-weight="700">$29<tspan fill="#8a8a84" font-size="10.5" font-weight="400"> /month</tspan></text>
    <text x="334" y="175"><tspan fill="#3a9a5b">✓</tspan>  Everything in Pro</text>
    <text x="334" y="193"><tspan fill="#3a9a5b">✓</tspan>  500 GB of storage</text>
    <text x="334" y="211"><tspan fill="#3a9a5b">✓</tspan>  SSO and audit log</text>
    <rect x="334" y="236" width="108" height="28" rx="6" fill="#fff" stroke="#d6d6d1"/>
    <text x="388" y="254" text-anchor="middle" fill="#141414" font-weight="600">Contact sales</text>
  </g>
</svg>
