      <text x="512" y="236" class="mono" font-size="12"><tspan fill="#a78bfa">偏好</tspan><tspan x="548" fill="#c9d1d9">commit 前先問我</tspan></text>
      <text x="512" y="258" class="mono" font-size="12"><tspan fill="#a78bfa">事實</tspan><tspan x="548" fill="#c9d1d9">設定只在面板調整</tspan></text>
      <text x="512" y="280" class="mono" font-size="12"><tspan fill="#a78bfa">位置</tspan><tspan x="548" fill="#c9d1d9">發版步驟在 CONTRIBUTING.md</tspan></text>
    </g>
  <g class="tab2">
      <text x="512" y="188" class="mono" font-size="12"><tspan fill="#4ade80" font-weight="700">8 次</tspan><tspan x="556" fill="#c9d1d9">宣稱正式站版本前，讀實際部署的版本</tspan></text>
      <text x="512" y="212" class="mono" font-size="12"><tspan fill="#4ade80" font-weight="700">5 次</tspan><tspan x="556" fill="#c9d1d9">推送前先在本機跑檢查</tspan></text>
      <text x="512" y="236" class="mono" font-size="12"><tspan fill="#4ade80" font-weight="700">3 次</tspan><tspan x="556" fill="#c9d1d9">Bash 路徑用正斜線</tspan></text>
      <text x="512" y="260" class="mono" font-size="12"><tspan fill="#4ade80" font-weight="700">2 次</tspan><tspan x="556" fill="#c9d1d9">推送前先問我</tspan></text>
    </g>
  <g class="tab3">
      <text x="512" y="188" class="mono" font-size="12"><tspan fill="#8b949e">14:05・每 30 則・3 項變動</tspan></text>
      <text x="512" y="212" class="mono" font-size="12"><tspan fill="#4ade80">+</tspan><tspan fill="#c9d1d9"> 規則  推送前先問我</tspan></text>
      <text x="512" y="236" class="mono" font-size="12"><tspan fill="#fbbf24">~</tspan><tspan fill="#c9d1d9"> 記憶  回覆語言</tspan></text>
      <text x="512" y="260" class="mono" font-size="12"><tspan fill="#4ade80">+</tspan><tspan fill="#c9d1d9"> 進度  面板動畫，下一步：README</tspan></text>
      <text x="512" y="288" class="mono" font-size="11" fill="#8b949e">本對話背景用量：快取讀 192,768 = 93.86%・輸出 844</text>
    </g>
  <g class="tab4">
      <text x="512" y="188" class="mono" font-size="12"><tspan fill="#c9d1d9">離開時保持快取</tspan><tspan x="634" fill="#7dd3fc">開</tspan><tspan x="674" fill="#8b949e">預設</tspan></text>
